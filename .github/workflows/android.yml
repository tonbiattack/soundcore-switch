name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI はテストとビルド成果物の保存だけを行う。
# リリース作成は署名鍵を持つローカル環境で手動で行う（docs/RELEASE.md）。
# そのため contents の書き込み権限は不要。
permissions:
  contents: read

jobs:
  # 共有ロジックのテスト。プラットフォーム非依存なので Linux で速く回す。
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run desktop tests
        run: ./gradlew :desktop:test --console=plain

      - name: Build MSI installer
        run: ./gradlew :desktop:packageMsi --console=plain

      # jpackage は失敗理由をファイルにしか書かないため、失敗時に内容を出す。
      - name: Show jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/compose/logs -Filter *.txt -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName
            }

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # リリースは個人の署名鍵と単調増加する versionCode を維持する必要がある。
  # CI の一時的な debug.keystore で APK を公開すると既存アプリを更新できず、
  # 毎回異なる署名にもなり得るため、自動公開しない。
  # 検証済みの署名済み APK をローカルから非公開 Releases に添付する。
