name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 共有ロジックのテスト。プラットフォーム非依存なので Linux で速く回す。
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run desktop tests
        run: ./gradlew :desktop:test --console=plain

      - name: Build MSI installer
        run: ./gradlew :desktop:packageMsi --console=plain

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # タグ push 時のみ Releases へ添付する（仕様書 §10-6「GitHub ReleasesでAPK配布」）。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: artifacts

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Soundcore Switch の配布物です。

            ## インストール

            ### Android
            1. 端末の「提供元不明のアプリ」を許可する
            2. `app-debug.apk` を開いてインストール

            ### Windows
            `SoundcoreSwitch-*.msi` を実行してください。

            ## 注意
            Android の APK は **debug ビルド**（デバッグ署名）です。個人利用を想定しています。

            ## 対応機種
            soundcore Liberty 4 NC (A3947) のみ実機検証済みです。
            Space A40 は未検証のため、切り替え機能は無効になります。
            詳細は [docs/SUPPORT_MATRIX.md](https://github.com/tonbiattack/soundcore-switch/blob/main/docs/SUPPORT_MATRIX.md)
            を参照してください。
